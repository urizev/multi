<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aprende las Tablas de Multiplicar</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --secondary-color: #f5a623;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .container {
            background-color: var(--card-bg);
            padding: clamp(1rem, 3.5vw, 2.5rem);
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.06);
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .container {
                box-shadow: none;
                border-radius: 0;
                padding: clamp(0.75rem, 3vw, 1.75rem);
            }
        }

        h1 {
            color: var(--primary-color);
            font-size: clamp(2rem, 5.5vw, 3.2rem);
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        p.subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.45rem);
            color: #64748b;
            margin: 0 0 20px 0;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 650px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.5vh, 24px);
            margin: auto 0;
        }

        .screen.active {
            display: flex;
        }

        /* Pantalla de Selección */
        .grid-tables {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(8px, 2vw, 16px);
            width: 100%;
            margin: 10px 0 20px 0;
        }

        .table-btn {
            aspect-ratio: 1 / 1;
            min-height: clamp(52px, 9vh, 85px);
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            border: 3px solid var(--primary-color);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .table-btn:hover {
            background-color: #edf5fd;
        }

        .table-btn:active {
            transform: scale(0.95);
        }

        .table-btn.selected {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.35);
        }

        /* Pantalla de Juego */
        .stats {
            width: 100%;
            font-size: clamp(1rem, 2.4vw, 1.25rem);
            color: #475569;
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: clamp(10px, 1.8vh, 16px) clamp(14px, 3vw, 24px);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .stat-item {
            font-weight: 500;
        }

        .stat-value {
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-value.error {
            color: var(--error-color);
        }

        .question {
            font-size: clamp(3.8rem, 13vw, 6.8rem);
            margin: clamp(10px, 3vh, 25px) 0;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        #answer-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="number"] {
            font-size: clamp(2.6rem, 8vw, 4.2rem);
            width: clamp(140px, 38vw, 240px);
            text-align: center;
            padding: clamp(8px, 1.5vh, 14px);
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            margin-bottom: clamp(15px, 2.5vh, 25px);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-weight: bold;
            color: #1e293b;
            background: #f8fafc;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.2);
        }

        /* Quitar flechas del input number para mayor limpieza visual */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .feedback {
            width: 100%;
            margin: clamp(8px, 1.5vh, 16px) 0;
            padding: clamp(12px, 1.8vh, 16px);
            border-radius: 12px;
            min-height: clamp(52px, 7vh, 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            transition: all 0.2s ease;
        }

        .feedback.correct {
            background-color: #eafaf1;
            color: var(--success-color);
            border: 1px solid #c7f0db;
        }

        .feedback.wrong {
            background-color: #fdf0ed;
            color: var(--error-color);
            border: 1px solid #fadbd8;
        }

        /* Pantalla Final */
        .summary-results {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: clamp(16px, 2.5vh, 26px);
            margin: clamp(10px, 2vh, 20px) 0;
            text-align: left;
            width: 100%;
        }

        .summary-results p {
            margin: 10px 0;
            font-size: clamp(1.1rem, 2.4vw, 1.35rem);
            color: #334155;
        }

        .slowest-container {
            margin-top: 18px;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
        }

        .slowest-container h3 {
            margin: 0 0 12px 0;
            font-size: clamp(1.05rem, 2.2vw, 1.25rem);
            color: #1e293b;
            font-weight: 700;
        }

        .slowest-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slowest-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(8px, 1.4vh, 12px) clamp(12px, 2.5vw, 16px);
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: clamp(1rem, 2.2vw, 1.15rem);
        }

        .slowest-list li .op {
            font-weight: bold;
            color: #1e293b;
        }

        .slowest-list li .op-time {
            color: #d97706;
            font-weight: 700;
        }

        /* Botones Generales */
        button.main-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: clamp(14px, 2vh, 18px) clamp(24px, 4vw, 36px);
            font-size: clamp(1.15rem, 2.6vw, 1.4rem);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 380px;
            margin: 6px auto;
            box-shadow: 0 4px 14px rgba(74, 144, 226, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        button.main-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 18px rgba(74, 144, 226, 0.4);
            transform: translateY(-1px);
        }

        button.main-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        button.main-btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla Inicial -->
        <div id="setup-screen" class="screen active">
            <h1>Tablas de Multiplicar</h1>
            <p class="subtitle">Selecciona las tablas que quieres practicar:</p>
            <div class="grid-tables" id="tables-container">
                <!-- Botones del 1 al 10 generados por JS -->
            </div>
            <button id="start-btn" class="main-btn" disabled>¡Empezar Juego!</button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen" class="screen">
            <div class="stats">
                <div class="stat-item">Pendientes: <span id="remaining-count" class="stat-value">0</span></div>
                <div class="stat-item">Fallos: <span id="mistakes-count" class="stat-value error">0</span></div>
                <div class="stat-item">Tiempo: <span id="timer-display" class="stat-value">0:00</span></div>
            </div>
            <div class="question" id="question-text">7 x 8</div>
            <form id="answer-form">
                <input type="number" id="answer-input" placeholder="?" autocomplete="off" inputmode="numeric" pattern="[0-9]*" required>
                <br>
                <button type="submit" class="main-btn">Responder</button>
            </form>
            <div id="feedback-area" class="feedback"></div>
            <button id="next-btn" class="main-btn hidden">Siguiente</button>
        </div>

        <!-- Pantalla Final -->
        <div id="finish-screen" class="screen">
            <h1>¡Felicidades!</h1>
            <p class="subtitle">Has completado todas las tablas seleccionadas con éxito.</p>
            <div class="summary-results">
                <p>⏱ <strong>Tiempo total:</strong> <span id="final-time">0:00</span></p>
                <p>❌ <strong>Total de fallos:</strong> <span id="final-mistakes">0</span></p>
                <div id="slowest-container" class="slowest-container">
                    <h3>Operaciones que más tiempo han llevado:</h3>
                    <ul id="slowest-list" class="slowest-list"></ul>
                </div>
            </div>
            <button id="restart-btn" class="main-btn">Jugar de nuevo</button>
        </div>
    </div>

    <script>
        // Variables de Estado
        let selectedTables = new Set();
        let questionsQueue = []; // Cola de preguntas pendientes (primera vez)
        let reviewQueue = []; // Cola de repasos (errores)
        let currentQuestion = null;
        let correctHistory = []; // Para intercalar cuando solo hay errores

        let mistakes = 0;
        let gameStartTime = null;
        let timerInterval = null;
        let questionStartTime = null;
        let operationStats = {}; // Registro de tiempos y estadísticas por operación
        let autoAdvanceTimer = null;

        // Elementos DOM
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const finishScreen = document.getElementById('finish-screen');
        const tablesContainer = document.getElementById('tables-container');
        const startBtn = document.getElementById('start-btn');
        const questionText = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const answerForm = document.getElementById('answer-form');
        const feedbackArea = document.getElementById('feedback-area');
        const nextBtn = document.getElementById('next-btn');
        const remainingCount = document.getElementById('remaining-count');
        const mistakesCount = document.getElementById('mistakes-count');
        const timerDisplay = document.getElementById('timer-display');
        const finalTime = document.getElementById('final-time');
        const finalMistakes = document.getElementById('final-mistakes');
        const slowestContainer = document.getElementById('slowest-container');
        const slowestList = document.getElementById('slowest-list');
        const restartBtn = document.getElementById('restart-btn');

        // Inicialización de botones de tablas
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.classList.add('table-btn');
            btn.onclick = () => toggleTable(i, btn);
            tablesContainer.appendChild(btn);
        }

        function toggleTable(num, btn) {
            if (selectedTables.has(num)) {
                selectedTables.delete(num);
                btn.classList.remove('selected');
            } else {
                selectedTables.add(num);
                btn.classList.add('selected');
            }
            startBtn.disabled = selectedTables.size === 0;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimer() {
            if (!gameStartTime) return;
            const elapsedSec = (Date.now() - gameStartTime) / 1000;
            timerDisplay.textContent = formatTime(elapsedSec);
        }

        // Lógica del Juego
        startBtn.onclick = startGame;

        function startGame() {
            questionsQueue = [];
            reviewQueue = [];
            correctHistory = [];
            mistakes = 0;
            operationStats = {};

            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // Generar todas las preguntas posibles de las tablas seleccionadas
            selectedTables.forEach(table => {
                for (let i = 1; i <= 10; i++) {
                    questionsQueue.push({ a: table, b: i });
                }
            });

            // Barajar preguntas iniciales
            shuffle(questionsQueue);

            mistakesCount.textContent = '0';
            timerDisplay.textContent = '0:00';
            gameStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            showScreen('game');
            nextQuestion();
        }

        function nextQuestion() {
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }

            feedbackArea.className = 'feedback';
            feedbackArea.textContent = '';
            answerInput.value = '';
            answerInput.disabled = false;
            answerForm.querySelector('button').classList.remove('hidden');
            nextBtn.classList.add('hidden');
            
            // Decidir qué preguntar
            if (questionsQueue.length > 0) {
                // Prioridad a preguntas nuevas si las hay
                currentQuestion = questionsQueue.shift();
            } else if (reviewQueue.length > 0) {
                // Si solo quedan repasos, a veces intercalamos una que ya supo bien (si existe)
                // para no saturar solo con errores, según el requisito.
                if (correctHistory.length > 0 && Math.random() > 0.7) {
                    currentQuestion = correctHistory[Math.floor(Math.random() * correctHistory.length)];
                    currentQuestion.isIntercalated = true;
                } else {
                    currentQuestion = reviewQueue.shift();
                    currentQuestion.isIntercalated = false;
                }
            } else {
                finishGame();
                return;
            }

            questionText.textContent = `${currentQuestion.a} x ${currentQuestion.b}`;
            updateRemaining();
            questionStartTime = performance.now();
            answerInput.focus();
        }

        answerForm.onsubmit = (e) => {
            e.preventDefault();
            if (answerInput.disabled) return;

            const timeSpent = (performance.now() - questionStartTime) / 1000;
            const opKey = `${currentQuestion.a} x ${currentQuestion.b}`;

            if (!operationStats[opKey]) {
                operationStats[opKey] = {
                    a: currentQuestion.a,
                    b: currentQuestion.b,
                    totalTime: 0,
                    attempts: 0,
                    maxTime: 0
                };
            }
            operationStats[opKey].totalTime += timeSpent;
            operationStats[opKey].attempts += 1;
            if (timeSpent > operationStats[opKey].maxTime) {
                operationStats[opKey].maxTime = timeSpent;
            }

            const userAnswer = parseInt(answerInput.value, 10);
            const correctAnswer = currentQuestion.a * currentQuestion.b;

            answerInput.disabled = true;
            answerForm.querySelector('button').classList.add('hidden');

            if (userAnswer === correctAnswer) {
                showFeedback(true, "¡Correcto!");
                
                // Si era una pregunta real (no intercalada) y no estaba en repaso
                if (!currentQuestion.isIntercalated && !currentQuestion.reviewCount) {
                    correctHistory.push({...currentQuestion});
                }
                
                // Si era una pregunta de repaso, descontamos uno
                if (currentQuestion.reviewCount > 0) {
                    currentQuestion.reviewCount--;
                    if (currentQuestion.reviewCount > 0) {
                        // Aún le falta un repaso, lo metemos al final de la cola de repaso
                        reviewQueue.push(currentQuestion);
                    }
                }

                // Avance automático tras acierto para maximizar la fluidez
                autoAdvanceTimer = setTimeout(() => {
                    nextQuestion();
                }, 1200);
            } else {
                mistakes++;
                mistakesCount.textContent = mistakes;
                showFeedback(false, `Incorrecto. El resultado era ${correctAnswer}. Lo repasaremos.`);
                
                // Si falla, se anota para repasar 2 veces
                // Si ya estaba en repaso, reseteamos a 2 veces (o simplemente aseguramos 2)
                currentQuestion.reviewCount = 2;
                currentQuestion.isIntercalated = false;
                reviewQueue.push(currentQuestion);
                
                // Si falló una que estaba en correctHistory, la quitamos de ahí
                correctHistory = correctHistory.filter(q => !(q.a === currentQuestion.a && q.b === currentQuestion.b));

                nextBtn.classList.remove('hidden');
                nextBtn.focus();
            }
            
            updateRemaining();
        };

        function finishGame() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }

            const totalSeconds = (Date.now() - gameStartTime) / 1000;
            finalTime.textContent = formatTime(totalSeconds);
            finalMistakes.textContent = mistakes;

            // Ordenar operaciones por tiempo total dedicado descendente
            const sortedOps = Object.values(operationStats).sort((a, b) => b.totalTime - a.totalTime);
            slowestList.innerHTML = '';

            const topSlowest = sortedOps.slice(0, 5);
            if (topSlowest.length === 0) {
                slowestContainer.style.display = 'none';
            } else {
                slowestContainer.style.display = 'block';
                topSlowest.forEach(op => {
                    const li = document.createElement('li');
                    const attemptsText = op.attempts > 1 ? ` (${op.attempts} intentos)` : '';
                    li.innerHTML = `
                        <span class="op">${op.a} x ${op.b}${attemptsText}</span>
                        <span class="op-time">${op.totalTime.toFixed(1)} s</span>
                    `;
                    slowestList.appendChild(li);
                });
            }

            showScreen('finish');
        }

        nextBtn.onclick = nextQuestion;

        function showFeedback(isCorrect, message) {
            feedbackArea.textContent = message;
            feedbackArea.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        }

        function updateRemaining() {
            // Estimación de pendientes: preguntas nuevas + preguntas en repaso (por sus turnos pendientes)
            const count = questionsQueue.length + reviewQueue.reduce((acc, q) => acc + (q.reviewCount || 1), 0);
            remainingCount.textContent = count;
        }

        function showScreen(screenName) {
            [setupScreen, gameScreen, finishScreen].forEach(s => s.classList.remove('active'));
            if (screenName === 'setup') setupScreen.classList.add('active');
            if (screenName === 'game') gameScreen.classList.add('active');
            if (screenName === 'finish') finishScreen.classList.add('active');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        restartBtn.onclick = () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }
            selectedTables.clear();
            document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
            startBtn.disabled = true;
            showScreen('setup');
        };

    </script>
</body>
</html>
