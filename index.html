<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aprende las Tablas de Multiplicar</title>
    <style>
        :root {
            --primary-color: #6c4ce3;
            --primary-hover: #5737cf;
            --secondary-color: #ffb830;
            --success-color: #159c67;
            --error-color: #e54b72;
            --text-color: #34305b;
            --card-bg: #fffefb;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #a8e6ff 0%, #d4c9ff 48%, #ffe3a8 100%);
        }

        body::before, body::after {
            position: fixed;
            z-index: 0;
            content: '';
            pointer-events: none;
            border-radius: 50%;
            opacity: 0.55;
        }

        body::before {
            width: 210px;
            height: 210px;
            top: 5%;
            left: -70px;
            background: #ffcf5c;
            box-shadow: 75px 120px 0 -55px #ff7fa8, 92vw 70vh 0 -45px #82dfbd;
        }

        body::after {
            width: 150px;
            height: 150px;
            right: -45px;
            bottom: 8%;
            background: #ff91bd;
            box-shadow: -80px -70vh 0 -40px #83d8ff;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: clamp(1rem, 3.5vw, 2.5rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            text-align: center;
            background: rgba(255, 254, 251, 0.94);
            box-shadow: 0 18px 55px rgba(78, 58, 151, 0.18);
        }

        h1 {
            margin: 0 0 8px;
            color: var(--primary-color);
            font-size: clamp(2rem, 5.5vw, 3.4rem);
            font-weight: 900;
            letter-spacing: -1.5px;
            text-shadow: 0 3px 0 #e4dcff;
        }

        p.subtitle {
            margin: 0 0 14px;
            color: #716d91;
            font-size: clamp(1.05rem, 2.5vw, 1.4rem);
            font-weight: 700;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 700px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.5vh, 24px);
            margin: auto 0;
        }

        .screen.active { display: flex; }

        .mascot {
            display: grid;
            width: clamp(76px, 13vw, 112px);
            aspect-ratio: 1;
            place-items: center;
            margin-bottom: -8px;
            border: 5px solid #fff;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe675, #ffb83e);
            box-shadow: 0 7px 0 #ef9e2e, 0 12px 22px rgba(180, 117, 24, 0.2);
            font-size: clamp(2.8rem, 7vw, 4rem);
            animation: mascot-float 2.8s ease-in-out infinite;
        }

        .grid-tables {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: clamp(8px, 2vw, 16px);
            margin: 4px 0 10px;
        }

        .table-btn {
            --shade: #3296c9;
            position: relative;
            width: 100%;
            min-width: 0;
            aspect-ratio: 1 / 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            color: #fff;
            background: #53b9ee;
            box-shadow: 0 6px 0 var(--shade), 0 9px 14px rgba(66, 127, 167, 0.16);
            cursor: pointer;
            font: inherit;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 900;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .table-btn:nth-child(5n + 1) { --shade: #d94d6b; background: #ff718d; }
        .table-btn:nth-child(5n + 2) { --shade: #dc8424; background: #ffae42; }
        .table-btn:nth-child(5n + 3) { --shade: #644dc4; background: #8c72ed; }
        .table-btn:nth-child(5n + 4) { --shade: #20a578; background: #45c99c; }

        .table-btn:hover { filter: brightness(1.07); transform: translateY(-3px) rotate(-2deg); }
        .table-btn:active { transform: translateY(3px) scale(0.97); }
        .table-btn.selected {
            border-color: #fff;
            filter: saturate(1.2) brightness(1.05);
            transform: translateY(-3px);
        }

        .table-btn.selected::after {
            content: '✓';
            position: absolute;
            top: -7px;
            right: -7px;
            display: grid;
            width: clamp(22px, 5.5vw, 32px);
            aspect-ratio: 1;
            place-items: center;
            border: 3px solid #fff;
            border-radius: 50%;
            color: #fff;
            background: var(--success-color);
            box-shadow: 0 3px 0 #0d7a50;
            font-size: clamp(0.8rem, 2.6vw, 1.1rem);
            line-height: 1;
            animation: check-pop 0.3s cubic-bezier(0.2, 1.4, 0.5, 1) both;
        }

        .stats {
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 8px;
            padding: clamp(10px, 1.8vh, 16px);
            border: 2px solid #ece8ff;
            border-radius: 24px;
            color: #615d7d;
            background: #f5f2ff;
            box-shadow: 0 5px 0 #e5defe;
            font-size: clamp(0.86rem, 2.4vw, 1.15rem);
        }

        .stat-item {
            padding: 5px 9px;
            border-radius: 16px;
            background: #fff;
            font-weight: 800;
        }

        .stat-value { color: var(--primary-color); font-weight: 900; }
        .stat-value.error { color: var(--error-color); }

        .progress-track {
            width: 100%;
            height: 15px;
            overflow: hidden;
            border: 2px solid #fff;
            border-radius: 20px;
            background: #e9e4fa;
            box-shadow: inset 0 2px 4px rgba(63, 45, 117, 0.1);
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #51d5a3, #c3e85a, #ffca59);
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .question {
            margin: clamp(8px, 2.5vh, 20px) 0;
            color: #39345d;
            font-size: clamp(3.8rem, 13vw, 6.8rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.1;
            text-shadow: 0 5px 0 #e8e2ff;
        }

        .question.pop { animation: question-pop 0.42s cubic-bezier(0.2, 1.4, 0.5, 1) both; }

        #answer-form {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        input[type="number"] {
            width: clamp(140px, 38vw, 240px);
            margin-bottom: clamp(15px, 2.5vh, 25px);
            padding: clamp(8px, 1.5vh, 14px);
            border: 4px solid #d7ceff;
            border-radius: 25px;
            outline: none;
            color: #39345d;
            background: #fff;
            box-shadow: 0 6px 0 #b9aaf7;
            text-align: center;
            font: inherit;
            font-size: clamp(2.6rem, 8vw, 4.2rem);
            font-weight: 900;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        input[type="number"]:focus {
            border-color: #8c72ed;
            box-shadow: 0 0 0 5px rgba(140, 114, 237, 0.18), 0 6px 0 #b9aaf7;
            transform: translateY(-2px);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .feedback {
            display: flex;
            width: 100%;
            min-height: clamp(52px, 7vh, 65px);
            align-items: center;
            justify-content: center;
            margin: clamp(8px, 1.5vh, 16px) 0;
            padding: clamp(12px, 1.8vh, 16px);
            border: 2px solid transparent;
            border-radius: 22px;
            font-size: clamp(1.05rem, 2.5vw, 1.35rem);
            font-weight: 900;
        }

        .feedback.correct {
            border-color: #a8efd3;
            color: #087a50;
            background: #dcfff0;
            animation: happy-bounce 0.55s ease both;
        }

        .feedback.wrong {
            border-color: #ffc0cf;
            color: #c8345c;
            background: #fff0f4;
            animation: gentle-shake 0.4s ease both;
        }

        .summary-results {
            width: 100%;
            margin: clamp(8px, 2vh, 18px) 0;
            padding: clamp(16px, 2.5vh, 26px);
            border: 3px solid #f6d77a;
            border-radius: 28px;
            background: linear-gradient(145deg, #fff9df, #fff1c5);
            box-shadow: 0 7px 0 #efd47f;
            text-align: left;
        }

        .summary-results p {
            margin: 10px 0;
            color: #514b70;
            font-size: clamp(1.05rem, 2.4vw, 1.3rem);
        }

        .final-stars { text-align: center; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: 6px; }

        .slowest-container { margin-top: 18px; padding-top: 14px; border-top: 2px dashed #e6c65f; }

        .slowest-container h3 {
            margin: 0 0 12px;
            color: #514b70;
            font-size: clamp(1.05rem, 2.2vw, 1.25rem);
            font-weight: 900;
        }

        .slowest-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }

        .slowest-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(8px, 1.4vh, 12px) clamp(12px, 2.5vw, 16px);
            border: 2px solid #f0e3b5;
            border-radius: 16px;
            background: #fffef8;
            font-size: clamp(1rem, 2.2vw, 1.15rem);
        }

        .slowest-list li .op { color: #39345d; font-weight: 900; }
        .slowest-list li .op-time { color: #c5780c; font-weight: 900; }

        button.main-btn {
            width: 100%;
            max-width: 380px;
            margin: 6px auto;
            padding: clamp(14px, 2vh, 18px) clamp(24px, 4vw, 36px);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            color: #fff;
            background: var(--primary-color);
            box-shadow: 0 7px 0 #4931ad, 0 11px 17px rgba(77, 56, 167, 0.2);
            cursor: pointer;
            font: inherit;
            font-size: clamp(1.15rem, 2.6vw, 1.4rem);
            font-weight: 900;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        button.main-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 10px 0 #4931ad, 0 14px 20px rgba(77, 56, 167, 0.2); }
        button.main-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 3px 0 #4931ad; }
        button.main-btn:disabled { color: #fff; background: #b8b4ca; box-shadow: 0 6px 0 #9691aa; cursor: not-allowed; }

        .confetti-layer { position: fixed; z-index: 5; inset: 0; overflow: hidden; pointer-events: none; }

        .confetti-piece {
            position: absolute;
            top: -30px;
            width: 12px;
            height: 18px;
            border-radius: 4px;
            animation: confetti-fall 1.8s ease-in forwards;
        }

        .hidden { display: none !important; }

        @keyframes check-pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes mascot-float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
        @keyframes question-pop { 0% { opacity: 0; transform: scale(0.7) rotate(-5deg); } 70% { transform: scale(1.08) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
        @keyframes happy-bounce { 0% { transform: scale(0.9); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
        @keyframes gentle-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @keyframes confetti-fall { to { transform: translate3d(var(--drift), 105vh, 0) rotate(720deg); opacity: 0; } }

        @media (min-width: 901px) {
            .container { max-width: 900px; border-right: 8px solid rgba(255, 255, 255, 0.7); border-left: 8px solid rgba(255, 255, 255, 0.7); }
        }

        @media (max-width: 520px) {
            .container { padding: max(0.8rem, env(safe-area-inset-top)) max(0.8rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left)); }
            .stats { gap: 4px; padding: 8px 5px; }
            .stat-item { padding: 5px 4px; }
            .table-btn { border-radius: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
        <!-- Pantalla Inicial -->
        <div id="setup-screen" class="screen active">
            <div class="mascot" aria-hidden="true">🦊</div>
            <h1>¡Juguemos con las tablas!</h1>
            <p class="subtitle">Elige las tablas y prepárate para aprender:</p>
            <div class="grid-tables" id="tables-container">
                <!-- Botones del 1 al 10 generados por JS -->
            </div>
            <button id="start-btn" class="main-btn" disabled>🎮 ¡Empezar juego!</button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen" class="screen">
            <div class="stats">
                <div class="stat-item">⭐ Por hacer: <span id="remaining-count" class="stat-value">0</span></div>
                <div class="stat-item">💔 Fallos: <span id="mistakes-count" class="stat-value error">0</span></div>
                <div class="stat-item">⏱️ <span id="timer-display" class="stat-value">0:00</span></div>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Progreso del juego" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="question" id="question-text">7 x 8</div>
            <form id="answer-form">
                <input type="number" id="answer-input" placeholder="?" autocomplete="off" inputmode="numeric" pattern="[0-9]*" required>
                <br>
                <button type="submit" class="main-btn">✨ Responder</button>
            </form>
            <div id="feedback-area" class="feedback" role="status" aria-live="polite"></div>
            <button id="next-btn" class="main-btn hidden">➡️ Siguiente</button>
        </div>

        <!-- Pantalla Final -->
        <div id="finish-screen" class="screen">
            <div class="mascot" aria-hidden="true">🏆</div>
            <h1>¡Nivel completado!</h1>
            <p class="subtitle">¡Lo has hecho genial! Mira tus estrellas:</p>
            <div class="summary-results">
                <p id="stars-display" class="final-stars" aria-label="Estrellas conseguidas">⭐⭐⭐</p>
                <p>⏱ <strong>Tiempo total:</strong> <span id="final-time">0:00</span></p>
                <p>💔 <strong>Total de fallos:</strong> <span id="final-mistakes">0</span></p>
                <div id="slowest-container" class="slowest-container">
                    <h3>🧠 ¡Estas operaciones fueron las más difíciles!</h3>
                    <ul id="slowest-list" class="slowest-list"></ul>
                </div>
            </div>
            <button id="restart-btn" class="main-btn">🔄 Jugar de nuevo</button>
        </div>
    </div>

    <script>
        // Variables de Estado
        let selectedTables = new Set();
        let questionsQueue = []; // Cola de preguntas pendientes (primera vez)
        let reviewQueue = []; // Cola de repasos (errores)
        let currentQuestion = null;
        let correctHistory = []; // Para intercalar cuando solo hay errores

        let mistakes = 0;
        let gameStartTime = null;
        let timerInterval = null;
        let questionStartTime = null;
        let operationStats = {}; // Registro de tiempos y estadísticas por operación
        let autoAdvanceTimer = null;
        let totalOperations = 0;
        let completedOperations = new Set();
        const encouragingMessages = [
            '¡Estupendo! ¡Eres una estrella! ⭐',
            '¡Muy bien! ¡Sigue así! 🎉',
            '¡Respuesta genial! 🚀',
            '¡Lo has conseguido! ¡Choca esos cinco! 🙌'
        ];

        // Elementos DOM
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const finishScreen = document.getElementById('finish-screen');
        const tablesContainer = document.getElementById('tables-container');
        const startBtn = document.getElementById('start-btn');
        const questionText = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const answerForm = document.getElementById('answer-form');
        const feedbackArea = document.getElementById('feedback-area');
        const nextBtn = document.getElementById('next-btn');
        const remainingCount = document.getElementById('remaining-count');
        const mistakesCount = document.getElementById('mistakes-count');
        const timerDisplay = document.getElementById('timer-display');
        const finalTime = document.getElementById('final-time');
        const finalMistakes = document.getElementById('final-mistakes');
        const starsDisplay = document.getElementById('stars-display');
        const progressBar = document.getElementById('progress-bar');
        const progressTrack = progressBar.parentElement;
        const confettiLayer = document.getElementById('confetti-layer');
        const slowestContainer = document.getElementById('slowest-container');
        const slowestList = document.getElementById('slowest-list');
        const restartBtn = document.getElementById('restart-btn');

        // Inicialización de botones de tablas
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.classList.add('table-btn');
            btn.setAttribute('aria-pressed', 'false');
            btn.onclick = () => toggleTable(i, btn);
            tablesContainer.appendChild(btn);
        }

        function toggleTable(num, btn) {
            if (selectedTables.has(num)) {
                selectedTables.delete(num);
                btn.classList.remove('selected');
                btn.setAttribute('aria-pressed', 'false');
            } else {
                selectedTables.add(num);
                btn.classList.add('selected');
                btn.setAttribute('aria-pressed', 'true');
            }
            startBtn.disabled = selectedTables.size === 0;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimer() {
            if (!gameStartTime) return;
            const elapsedSec = (Date.now() - gameStartTime) / 1000;
            timerDisplay.textContent = formatTime(elapsedSec);
        }

        // Lógica del Juego
        startBtn.onclick = startGame;

        function startGame() {
            questionsQueue = [];
            reviewQueue = [];
            correctHistory = [];
            mistakes = 0;
            operationStats = {};
            completedOperations = new Set();
            totalOperations = selectedTables.size * 10;
            progressBar.style.width = '0%';
            progressTrack.setAttribute('aria-valuenow', '0');

            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // Generar todas las preguntas posibles de las tablas seleccionadas
            selectedTables.forEach(table => {
                for (let i = 1; i <= 10; i++) {
                    questionsQueue.push({ a: table, b: i });
                }
            });

            // Barajar preguntas iniciales
            shuffle(questionsQueue);

            mistakesCount.textContent = '0';
            timerDisplay.textContent = '0:00';
            gameStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

            showScreen('game');
            nextQuestion();
        }

        function nextQuestion() {
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }

            feedbackArea.className = 'feedback';
            feedbackArea.textContent = '';
            answerInput.value = '';
            answerInput.disabled = false;
            answerForm.querySelector('button').classList.remove('hidden');
            nextBtn.classList.add('hidden');
            
            // Decidir qué preguntar
            if (questionsQueue.length > 0) {
                // Prioridad a preguntas nuevas si las hay
                currentQuestion = questionsQueue.shift();
            } else if (reviewQueue.length > 0) {
                // Si solo quedan repasos, a veces intercalamos una que ya supo bien (si existe)
                // para no saturar solo con errores, según el requisito.
                if (correctHistory.length > 0 && Math.random() > 0.7) {
                    currentQuestion = correctHistory[Math.floor(Math.random() * correctHistory.length)];
                    currentQuestion.isIntercalated = true;
                } else {
                    currentQuestion = reviewQueue.shift();
                    currentQuestion.isIntercalated = false;
                }
            } else {
                finishGame();
                return;
            }

            questionText.textContent = `${currentQuestion.a} x ${currentQuestion.b}`;
            questionText.classList.remove('pop');
            void questionText.offsetWidth;
            questionText.classList.add('pop');
            updateRemaining();
            questionStartTime = performance.now();
            answerInput.focus();
        }

        answerForm.onsubmit = (e) => {
            e.preventDefault();
            if (answerInput.disabled) return;

            const timeSpent = (performance.now() - questionStartTime) / 1000;
            const opKey = `${currentQuestion.a} x ${currentQuestion.b}`;

            if (!operationStats[opKey]) {
                operationStats[opKey] = {
                    a: currentQuestion.a,
                    b: currentQuestion.b,
                    totalTime: 0,
                    attempts: 0,
                    maxTime: 0
                };
            }
            operationStats[opKey].totalTime += timeSpent;
            operationStats[opKey].attempts += 1;
            if (timeSpent > operationStats[opKey].maxTime) {
                operationStats[opKey].maxTime = timeSpent;
            }

            const userAnswer = parseInt(answerInput.value, 10);
            const correctAnswer = currentQuestion.a * currentQuestion.b;

            answerInput.disabled = true;
            answerForm.querySelector('button').classList.add('hidden');

            if (userAnswer === correctAnswer) {
                showFeedback(true, encouragingMessages[Math.floor(Math.random() * encouragingMessages.length)]);
                celebrate(14);
                
                // Si era una pregunta real (no intercalada) y no estaba en repaso
                if (!currentQuestion.isIntercalated && !currentQuestion.reviewCount) {
                    correctHistory.push({...currentQuestion});
                }
                
                // Si era una pregunta de repaso, descontamos uno
                if (currentQuestion.reviewCount > 0) {
                    currentQuestion.reviewCount--;
                    if (currentQuestion.reviewCount > 0) {
                        // Aún le falta un repaso, lo metemos al final de la cola de repaso
                        reviewQueue.push(currentQuestion);
                    }
                }
                if (!currentQuestion.reviewCount) {
                    completedOperations.add(opKey);
                }

                // Avance automático tras acierto para maximizar la fluidez
                autoAdvanceTimer = setTimeout(() => {
                    nextQuestion();
                }, 2000);
            } else {
                mistakes++;
                mistakesCount.textContent = mistakes;
                completedOperations.delete(opKey);
                showFeedback(false, `¡Casi! La respuesta era ${correctAnswer}. ¡Lo intentarás de nuevo! 💪`);
                
                // Si falla, se anota para repasar 2 veces
                // Si ya estaba en repaso, reseteamos a 2 veces (o simplemente aseguramos 2)
                currentQuestion.reviewCount = 2;
                currentQuestion.isIntercalated = false;
                reviewQueue.push(currentQuestion);
                
                // Si falló una que estaba en correctHistory, la quitamos de ahí
                correctHistory = correctHistory.filter(q => !(q.a === currentQuestion.a && q.b === currentQuestion.b));

                nextBtn.classList.remove('hidden');
                nextBtn.focus();
            }
            
            updateRemaining();
        };

        function finishGame() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }

            const totalSeconds = (Date.now() - gameStartTime) / 1000;
            finalTime.textContent = formatTime(totalSeconds);
            finalMistakes.textContent = mistakes;
            const stars = mistakes === 0 ? 3 : mistakes <= 3 ? 2 : 1;
            starsDisplay.textContent = '⭐'.repeat(stars);
            starsDisplay.setAttribute('aria-label', `${stars} ${stars === 1 ? 'estrella' : 'estrellas'} conseguidas`);
            celebrate(36);

            // Ordenar operaciones por tiempo total dedicado descendente
            const sortedOps = Object.values(operationStats).sort((a, b) => b.totalTime - a.totalTime);
            slowestList.innerHTML = '';

            const topSlowest = sortedOps.slice(0, 5);
            if (topSlowest.length === 0) {
                slowestContainer.style.display = 'none';
            } else {
                slowestContainer.style.display = 'block';
                topSlowest.forEach(op => {
                    const li = document.createElement('li');
                    const attemptsText = op.attempts > 1 ? ` (${op.attempts} intentos)` : '';
                    li.innerHTML = `
                        <span class="op">${op.a} x ${op.b}${attemptsText}</span>
                        <span class="op-time">${op.totalTime.toFixed(1)} s</span>
                    `;
                    slowestList.appendChild(li);
                });
            }

            showScreen('finish');
        }

        nextBtn.onclick = nextQuestion;

        function showFeedback(isCorrect, message) {
            feedbackArea.textContent = message;
            feedbackArea.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        }

        function updateRemaining() {
            // Estimación de pendientes: preguntas nuevas + preguntas en repaso (por sus turnos pendientes)
            const count = questionsQueue.length + reviewQueue.reduce((acc, q) => acc + (q.reviewCount || 1), 0);
            remainingCount.textContent = count;
            const progress = totalOperations ? Math.round(completedOperations.size / totalOperations * 100) : 0;
            progressBar.style.width = `${progress}%`;
            progressTrack.setAttribute('aria-valuenow', progress);
        }

        function celebrate(pieceCount) {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const colors = ['#ff718d', '#ffcb4b', '#45c99c', '#53b9ee', '#8c72ed'];
            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement('span');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.setProperty('--drift', `${Math.round(Math.random() * 160 - 80)}px`);
                piece.style.animationDelay = `${Math.random() * 0.35}s`;
                confettiLayer.appendChild(piece);
                setTimeout(() => piece.remove(), 2400);
            }
        }

        function showScreen(screenName) {
            [setupScreen, gameScreen, finishScreen].forEach(s => s.classList.remove('active'));
            if (screenName === 'setup') setupScreen.classList.add('active');
            if (screenName === 'game') gameScreen.classList.add('active');
            if (screenName === 'finish') finishScreen.classList.add('active');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        restartBtn.onclick = () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }
            selectedTables.clear();
            document.querySelectorAll('.table-btn').forEach(b => {
                b.classList.remove('selected');
                b.setAttribute('aria-pressed', 'false');
            });
            startBtn.disabled = true;
            showScreen('setup');
        };

    </script>
</body>
</html>
